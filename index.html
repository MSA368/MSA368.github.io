<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lataa tiedostot yksitellen</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .file-list {
            margin-top: 25px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #eee;
        }
        .file-name {
            font-weight: 500;
            color: #555;
        }
        .download-btn {
            background-color: #008CBA;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #007b9a;
        }
    </style>
</head>
<body>

<div class="file-list">
    <!-- Tiedosto 1 -->
    <div class="file-item">
        <span class="file-name">1. encryptor (Tekstitiedosto)</span>
        <a href="encryptor.py" download="encryptor.txt" class="download-btn">Lataa</a>
    </div>

    <!-- Tiedosto 2 -->
    <div class="file-item">
        <span class="file-name">2. malware (Pakattu kansio)</span>
        <a href="malware.py" download="malware.zip" class="download-btn">Lataa</a>
    </div>

    <!-- Tiedosto 3 -->
    <div class="file-item">
        <span class="file-name">3. decryptor (Python-skripti)</span>
        <a href="decryptor.py" download="decryptor.py" class="download-btn">Lataa</a>
    </div>

    <!-- Tiedosto 4 (Korjattu href-polku) -->
    <div class="file-item">
        <span class="file-name">4. ransomware (Kuvatiedosto)</span>
        <a href="kuva.png" download="encryptorwithwindow.py" class="download-btn">Lataa</a>
    </div>
</div>

</body>
</html>
