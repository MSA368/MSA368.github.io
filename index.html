<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sade — Kuuntele hetki</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --fog: #b8c8d4;
    --mist: #7a96a8;
    --slate: #3d5560;
    --deep: #1a2a32;
    --ink: #0d1a20;
    --rain: rgba(180, 210, 230, 0.55);
    --glass: rgba(255,255,255,0.07);
    --accent: #5eb8d4;
  }

  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(170deg, #1a2a32 0%, #0d1a20 60%, #0a1218 100%);
    overflow: hidden;
    font-family: 'DM Serif Display', serif;
    color: var(--fog);
    cursor: default;
    user-select: none;
  }

  /* Rain canvas */
  #rain-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Window frame */
  .window-frame {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      linear-gradient(to right, rgba(13,26,32,0.7) 0%, transparent 12%, transparent 88%, rgba(13,26,32,0.7) 100%),
      linear-gradient(to bottom, rgba(13,26,32,0.5) 0%, transparent 15%, transparent 80%, rgba(13,26,32,0.8) 100%);
  }

  /* Window cross bars */
  .window-frame::before, .window-frame::after {
    content: '';
    position: absolute;
    background: rgba(100,140,160,0.12);
  }
  .window-frame::before {
    width: 100%; height: 1px;
    top: 50%; left: 0;
  }
  .window-frame::after {
    width: 1px; height: 100%;
    left: 50%; top: 0;
  }

  /* Fog / condensation effect */
  .condensation {
    position: fixed; inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 30% 70%, rgba(140,180,200,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(100,160,190,0.03) 0%, transparent 50%);
  }

  /* UI overlay */
  .ui {
    position: fixed;
    z-index: 10;
  }

  /* Title */
  .title-area {
    top: 40px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    animation: rise 2s ease 0.5s forwards;
  }

  .title-area h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--fog);
    text-shadow: 0 2px 30px rgba(94,184,212,0.2);
  }

  .title-area .subtitle {
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: var(--mist);
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.6;
  }

  /* Controls panel */
  .controls {
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    opacity: 0;
    animation: rise 2s ease 1.2s forwards;
    width: min(380px, 90vw);
  }

  .play-btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 1px solid rgba(180,210,230,0.3);
    background: var(--glass);
    backdrop-filter: blur(8px);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease;
    color: var(--fog);
    flex-shrink: 0;
  }
  .play-btn:hover {
    border-color: rgba(94,184,212,0.6);
    background: rgba(94,184,212,0.08);
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(94,184,212,0.15);
  }
  .play-btn svg { width: 24px; height: 24px; fill: currentColor; }

  .sliders-row {
    display: flex;
    gap: 16px;
    width: 100%;
    align-items: stretch;
  }

  .slider-card {
    flex: 1;
    background: var(--glass);
    border: 1px solid rgba(180,210,230,0.1);
    border-radius: 14px;
    padding: 16px 14px 12px;
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .slider-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--mist);
    opacity: 0.7;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: rgba(180,210,230,0.15);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(94,184,212,0.5);
    transition: transform 0.2s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .slider-value {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    opacity: 0.8;
    text-align: right;
  }

  /* Mood row */
  .mood-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .mood-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid rgba(180,210,230,0.15);
    background: transparent;
    color: var(--mist);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .mood-btn:hover, .mood-btn.active {
    border-color: rgba(94,184,212,0.5);
    color: var(--accent);
    background: rgba(94,184,212,0.08);
  }

  /* Status text */
  .status {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--mist);
    opacity: 0.5;
    text-align: center;
    min-height: 1em;
  }

  /* Lightning flash */
  .lightning {
    position: fixed; inset: 0;
    background: rgba(220,240,255,0.08);
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.05s;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateX(-50%) translateY(12px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<canvas id="rain-canvas"></canvas>
<div class="window-frame"></div>
<div class="condensation"></div>
<div class="lightning" id="lightning"></div>

<div class="ui title-area">
  <h1>Sade</h1>
  <div class="subtitle">Kuuntele hetki</div>
</div>

<div class="ui controls">
  <div class="mood-row">
    <button class="mood-btn active" data-mood="gentle">Lempeä</button>
    <button class="mood-btn" data-mood="steady">Tasainen</button>
    <button class="mood-btn" data-mood="storm">Myrsky</button>
  </div>

  <div style="display:flex;gap:16px;align-items:center;width:100%;">
    <button class="play-btn" id="playBtn" title="Toista / Pysäytä">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="sliders-row" style="flex:1;margin:0;">
      <div class="slider-card">
        <div class="slider-label">Voimakkuus</div>
        <input type="range" id="intensitySlider" min="0" max="100" value="40">
        <div class="slider-value" id="intensityVal">40%</div>
      </div>
      <div class="slider-card">
        <div class="slider-label">Äänenvoimakkuus</div>
        <input type="range" id="volumeSlider" min="0" max="100" value="60">
        <div class="slider-value" id="volumeVal">60%</div>
      </div>
    </div>
  </div>

  <div class="status" id="status">Paina play aloittaaksesi</div>
</div>

<script>
// ─── Audio Engine ───────────────────────────────────────────────
let audioCtx = null;
let masterGain = null;
let rainSource = null;
let playing = false;
let bufferNode = null;

const moods = {
  gentle: { intensity: 30, drops: 0.4, thunder: false },
  steady: { intensity: 60, drops: 0.7, thunder: false },
  storm:  { intensity: 90, drops: 1.0, thunder: true  }
};
let currentMood = 'gentle';

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.6;
  masterGain.connect(audioCtx.destination);
}

function createRainNoise() {
  if (!audioCtx) return;
  stopRain();

  const bufferSize = audioCtx.sampleRate * 4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1);
  }

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.loop = true;

  // High-pass for hiss
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 1000;

  // Low-pass for rumble layer
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 600;

  const gainHiss = audioCtx.createGain();
  gainHiss.gain.value = 0.18;

  const gainRumble = audioCtx.createGain();
  gainRumble.gain.value = 0.06;

  // Panning LFO for movement
  const panner = audioCtx.createStereoPanner();
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 0.1;
  lfoGain.gain.value = 0.3;
  lfo.connect(lfoGain);
  lfoGain.connect(panner.pan);
  lfo.start();

  source.connect(hp);
  hp.connect(gainHiss);
  gainHiss.connect(panner);

  source.connect(lp);
  lp.connect(gainRumble);
  gainRumble.connect(panner);

  panner.connect(masterGain);
  source.start();
  rainSource = { source, gainHiss, gainRumble, lfo };
}

function stopRain() {
  if (rainSource) {
    try { rainSource.source.stop(); rainSource.lfo.stop(); } catch(e){}
    rainSource = null;
  }
}

function setRainIntensity(val) {
  if (!rainSource) return;
  const t = audioCtx.currentTime + 0.1;
  const v = val / 100;
  rainSource.gainHiss.gain.linearRampToValueAtTime(v * 0.22, t);
  rainSource.gainRumble.gain.linearRampToValueAtTime(v * 0.08, t);
}

function setVolume(val) {
  if (!masterGain) return;
  masterGain.gain.value = val / 100;
}

// Thunder
function triggerThunder() {
  if (!audioCtx || !playing) return;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.4));
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 200;
  const g = audioCtx.createGain();
  g.gain.value = 0.5;
  src.connect(lp); lp.connect(g); g.connect(masterGain);
  src.start();

  // Flash
  const fl = document.getElementById('lightning');
  fl.style.opacity = '1';
  setTimeout(() => { fl.style.opacity = '0'; }, 80);
  setTimeout(() => { fl.style.opacity = '0.5'; }, 150);
  setTimeout(() => { fl.style.opacity = '0'; }, 250);
}

let thunderTimer;
function scheduleThunder() {
  clearTimeout(thunderTimer);
  if (!moods[currentMood].thunder || !playing) return;
  const delay = 8000 + Math.random() * 20000;
  thunderTimer = setTimeout(() => {
    triggerThunder();
    scheduleThunder();
  }, delay);
}

// ─── Rain Canvas ─────────────────────────────────────────────────
const canvas = document.getElementById('rain-canvas');
const ctx = canvas.getContext('2d');
let drops = [];
let splashes = [];
let W, H;
let intensity = 40;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function spawnDrop() {
  const x = Math.random() * W * 1.3 - W * 0.15;
  const speed = 8 + Math.random() * 10;
  const len = 12 + Math.random() * 20;
  const alpha = 0.2 + Math.random() * 0.5;
  drops.push({ x, y: -len, vx: 1.5 + Math.random(), vy: speed, len, alpha });
}

function spawnSplash(x, y) {
  for (let i = 0; i < 4; i++) {
    const angle = -Math.PI + Math.random() * Math.PI;
    const speed = 1.5 + Math.random() * 3;
    splashes.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      size: 1 + Math.random() * 1.5
    });
  }
}

function frame() {
  ctx.clearRect(0, 0, W, H);

  // Spawn drops
  const count = Math.floor(intensity / 6);
  for (let i = 0; i < count; i++) {
    if (Math.random() < 0.4) spawnDrop();
  }

  // Draw drops
  drops = drops.filter(d => {
    d.x += d.vx; d.y += d.vy;
    if (d.y > H) {
      spawnSplash(d.x, H - 2);
      return false;
    }
    ctx.save();
    ctx.strokeStyle = `rgba(180,215,235,${d.alpha})`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.vx * 0.6, d.y - d.vy * 0.6);
    ctx.stroke();
    ctx.restore();
    return true;
  });

  // Draw splashes
  splashes = splashes.filter(s => {
    s.x += s.vx; s.y += s.vy; s.vy += 0.3; s.life -= 0.06;
    if (s.life <= 0) return false;
    ctx.save();
    ctx.globalAlpha = s.life * 0.5;
    ctx.fillStyle = 'rgba(180,215,235,0.9)';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return true;
  });

  // Window condensation streaks (slow drips on glass)
  if (Math.random() < 0.003) {
    const gx = Math.random() * W;
    ctx.save();
    ctx.strokeStyle = 'rgba(180,210,230,0.07)';
    ctx.lineWidth = 1.5 + Math.random() * 2;
    ctx.beginPath();
    const gy = Math.random() * H * 0.5;
    ctx.moveTo(gx, gy);
    ctx.lineTo(gx + (Math.random()-0.5)*10, gy + 40 + Math.random() * 80);
    ctx.stroke();
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

// ─── Controls ────────────────────────────────────────────────────
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const intensitySlider = document.getElementById('intensitySlider');
const volumeSlider = document.getElementById('volumeSlider');
const statusEl = document.getElementById('status');

const PLAY_PATH  = 'M8 5v14l11-7z';
const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

playBtn.addEventListener('click', () => {
  initAudio();
  if (!playing) {
    playing = true;
    createRainNoise();
    setRainIntensity(intensity);
    setVolume(parseInt(volumeSlider.value));
    playIcon.querySelector('path').setAttribute('d', PAUSE_PATH);
    statusEl.textContent = 'Kuuntelee sadetta…';
    scheduleThunder();
  } else {
    playing = false;
    stopRain();
    clearTimeout(thunderTimer);
    playIcon.querySelector('path').setAttribute('d', PLAY_PATH);
    statusEl.textContent = 'Pysäytetty';
  }
});

intensitySlider.addEventListener('input', e => {
  intensity = parseInt(e.target.value);
  document.getElementById('intensityVal').textContent = intensity + '%';
  setRainIntensity(intensity);
});

volumeSlider.addEventListener('input', e => {
  const v = parseInt(e.target.value);
  document.getElementById('volumeVal').textContent = v + '%';
  setVolume(v);
});

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMood = btn.dataset.mood;
    const m = moods[currentMood];
    intensitySlider.value = m.intensity;
    intensity = m.intensity;
    document.getElementById('intensityVal').textContent = m.intensity + '%';
    setRainIntensity(m.intensity);
    clearTimeout(thunderTimer);
    scheduleThunder();
    const names = { gentle: 'Lempeä sade…', steady: 'Tasainen sade…', storm: 'Myrsky tulossa…' };
    if (playing) statusEl.textContent = names[currentMood];
  });
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
