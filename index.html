<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latauskeskus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-name {
            font-weight: bold;
            color: #555;
        }
        .download-btn {
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lataa tiedostoja</h1>
    <ul class="file-list">
        
        <!-- TOISTA TÄTÄ RIVIÄ JOKAISELLE TIEDOSTOLLE -->
        <li class="file-item">
            <span class="file-name">encryptor.exe</span>
            <a href="encryptor.exe" download class="download-btn">Lataa</a>
        </li>
        
        <li class="file-item">
            <span class="file-name">malware.exe</span>
            <a href="malware.exe" download class="download-btn">Lataa</a>
        </li>

        <li class="file-item">
            <span class="file-name">decryptor.py</span>
            <a href="decryptor.py" download class="download-btn">Lataa</a>
        </li>

    </ul>
</div>

</body>
</html>
